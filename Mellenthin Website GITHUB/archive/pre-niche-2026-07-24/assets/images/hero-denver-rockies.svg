<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustration of the Denver skyline in front of the Rocky Mountains at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#071528"/>
      <stop offset="32%"  stop-color="#123252"/>
      <stop offset="58%"  stop-color="#2b5578"/>
      <stop offset="78%"  stop-color="#7b7f92"/>
      <stop offset="92%"  stop-color="#c2895f"/>
      <stop offset="100%" stop-color="#e6ab74"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.30" cy="0.72" r="0.55">
      <stop offset="0%"   stop-color="#ffd9a8" stop-opacity="0.55"/>
      <stop offset="45%"  stop-color="#e6a76e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#e6a76e" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rangeBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5c7391"/>
      <stop offset="100%" stop-color="#3e5673"/>
    </linearGradient>

    <linearGradient id="rangeMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#33496a"/>
      <stop offset="100%" stop-color="#22334d"/>
    </linearGradient>

    <linearGradient id="rangeFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1b2942"/>
      <stop offset="100%" stop-color="#101b2d"/>
    </linearGradient>

    <linearGradient id="cityGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#16233a"/>
      <stop offset="100%" stop-color="#0c1524"/>
    </linearGradient>

    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0b1322"/>
      <stop offset="100%" stop-color="#060c17"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="180"  cy="80"  r="1.4"/><circle cx="420" cy="52"  r="1.1"/>
    <circle cx="640"  cy="118" r="1.5"/><circle cx="905" cy="66"  r="1.2"/>
    <circle cx="1120" cy="104" r="1.4"/><circle cx="1348" cy="58" r="1.1"/>
    <circle cx="1502" cy="132" r="1.3"/><circle cx="292" cy="168" r="1.0"/>
    <circle cx="760"  cy="192" r="1.0"/><circle cx="1230" cy="176" r="1.0"/>
  </g>

  <!-- Far snow-capped range -->
  <g>
    <path fill="url(#rangeBack)" d="M0,640 L0,486 L96,404 L168,452 L268,336 L356,428 L448,368 L556,300 L648,398 L742,344 L872,286 L988,384 L1096,330 L1214,406 L1330,340 L1448,414 L1540,362 L1600,398 L1600,640 Z"/>
    <g fill="#e9eff6" opacity="0.92">
      <path d="M268,336 L232,382 L252,374 L268,388 L288,368 L306,382 Z"/>
      <path d="M556,300 L516,348 L538,340 L556,354 L578,336 L596,350 Z"/>
      <path d="M872,286 L830,336 L854,328 L872,342 L894,322 L914,338 Z"/>
      <path d="M1096,330 L1064,372 L1082,364 L1096,376 L1114,360 L1130,372 Z"/>
      <path d="M1330,340 L1300,380 L1316,372 L1330,384 L1346,370 L1362,382 Z"/>
      <path d="M448,368 L424,400 L438,394 L448,404 L462,392 L474,402 Z"/>
      <path d="M1540,362 L1516,394 L1530,388 L1540,398 L1554,386 L1566,396 Z"/>
    </g>
  </g>

  <!-- Mid range -->
  <path fill="url(#rangeMid)" d="M0,660 L0,548 L118,478 L226,528 L338,462 L462,522 L586,452 L706,514 L836,466 L962,524 L1086,470 L1212,528 L1338,478 L1466,530 L1600,486 L1600,660 Z"/>

  <!-- Foothills behind the city -->
  <path fill="url(#rangeFront)" d="M0,700 L0,596 L140,556 L300,592 L470,552 L640,590 L820,556 L1000,594 L1180,558 L1360,596 L1520,562 L1600,586 L1600,700 Z"/>

  <!-- Denver skyline silhouette -->
  <g fill="url(#cityGrad)">
    <!-- low-rise left -->
    <rect x="60"  y="642" width="54"  height="78"/>
    <rect x="122" y="620" width="42"  height="100"/>
    <rect x="172" y="656" width="60"  height="64"/>
    <!-- stepped tower -->
    <path d="M244,720 L244,596 L268,596 L268,572 L318,572 L318,596 L342,596 L342,720 Z"/>
    <rect x="352" y="628" width="46" height="92"/>
    <!-- cathedral-style spires -->
    <path d="M410,720 L410,624 L424,592 L438,624 L438,720 Z"/>
    <path d="M446,720 L446,636 L458,610 L470,636 L470,720 Z"/>
    <rect x="480" y="650" width="52" height="70"/>
    <!-- Republic Plaza style: tall flat tower -->
    <rect x="544" y="518" width="76" height="202"/>
    <rect x="556" y="502" width="52" height="18"/>
    <!-- mid cluster -->
    <rect x="630" y="588" width="48" height="132"/>
    <path d="M688,720 L688,560 L716,532 L744,560 L744,720 Z"/>
    <rect x="754" y="606" width="44" height="114"/>
    <!-- "cash register" curved crown tower -->
    <path d="M808,720 L808,546 C808,506 900,506 900,546 L900,720 Z"/>
    <!-- antenna tower -->
    <rect x="912" y="580" width="56" height="140"/>
    <rect x="936" y="536" width="8"  height="46"/>
    <!-- 1801 California style slab -->
    <rect x="980"  y="540" width="66" height="180"/>
    <rect x="1056" y="614" width="40" height="106"/>
    <!-- pointed crown tower -->
    <path d="M1106,720 L1106,572 L1134,540 L1162,572 L1162,720 Z"/>
    <rect x="1174" y="622" width="52" height="98"/>
    <rect x="1236" y="592" width="38" height="128"/>
    <!-- right low-rise -->
    <rect x="1284" y="648" width="58" height="72"/>
    <path d="M1352,720 L1352,618 L1376,600 L1400,618 L1400,720 Z"/>
    <rect x="1412" y="660" width="66" height="60"/>
    <rect x="1488" y="634" width="48" height="86"/>
    <rect x="1546" y="666" width="54" height="54"/>
  </g>

  <!-- Window lights -->
  <g fill="#ffd9a1" opacity="0.55">
    <rect x="556" y="536" width="6" height="9"/><rect x="572" y="558" width="6" height="9"/>
    <rect x="592" y="536" width="6" height="9"/><rect x="600" y="592" width="6" height="9"/>
    <rect x="560" y="616" width="6" height="9"/><rect x="588" y="648" width="6" height="9"/>
    <rect x="824" y="576" width="6" height="9"/><rect x="852" y="600" width="6" height="9"/>
    <rect x="876" y="568" width="6" height="9"/><rect x="836" y="640" width="6" height="9"/>
    <rect x="868" y="668" width="6" height="9"/>
    <rect x="996" y="566" width="6" height="9"/><rect x="1020" y="598" width="6" height="9"/>
    <rect x="1000" y="638" width="6" height="9"/><rect x="1024" y="676" width="6" height="9"/>
    <rect x="702" y="592" width="6" height="9"/><rect x="724" y="628" width="6" height="9"/>
    <rect x="1120" y="608" width="6" height="9"/><rect x="1142" y="652" width="6" height="9"/>
    <rect x="928" y="612" width="6" height="9"/><rect x="948" y="656" width="6" height="9"/>
    <rect x="286" y="620" width="6" height="9"/><rect x="308" y="660" width="6" height="9"/>
  </g>

  <!-- Foreground ground -->
  <rect x="0" y="716" width="1600" height="184" fill="url(#ground)"/>
</svg>
