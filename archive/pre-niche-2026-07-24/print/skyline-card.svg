<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 240" preserveAspectRatio="xMidYMax meet" role="presentation">
  <!--
    Denver skyline strip, built specifically for the business card back.

    This is NOT the website hero SVG. That one is cropped from a 1600x900
    scene and, at card scale, two things went wrong: its building fill
    (#16233a) is almost identical to the card's navy (#0d1f33) so the
    silhouettes vanished, and its warm window lights (#ffd9a1) stayed
    visible — leaving what looked like random boxes floating on navy.

    So: same building shapes, baseline pulled up to a 240-tall strip,
    one flat fill light enough to read against the card, and NO windows.
    Opacity is controlled in the card CSS, not here.
  -->
  <g fill="#38618f">
    <!-- low-rise left -->
    <rect x="60"  y="162" width="54" height="78"/>
    <rect x="122" y="140" width="42" height="100"/>
    <rect x="172" y="176" width="60" height="64"/>
    <!-- stepped tower -->
    <path d="M244,240 L244,116 L268,116 L268,92 L318,92 L318,116 L342,116 L342,240 Z"/>
    <rect x="352" y="148" width="46" height="92"/>
    <!-- cathedral spires -->
    <path d="M410,240 L410,144 L424,112 L438,144 L438,240 Z"/>
    <path d="M446,240 L446,156 L458,130 L470,156 L470,240 Z"/>
    <rect x="480" y="170" width="52" height="70"/>
    <!-- Republic Plaza style flat tower -->
    <rect x="544" y="38" width="76" height="202"/>
    <rect x="556" y="22" width="52" height="18"/>
    <!-- mid cluster -->
    <rect x="630" y="108" width="48" height="132"/>
    <path d="M688,240 L688,80 L716,52 L744,80 L744,240 Z"/>
    <rect x="754" y="126" width="44" height="114"/>
    <!-- "cash register" curved crown -->
    <path d="M808,240 L808,66 C808,26 900,26 900,66 L900,240 Z"/>
    <!-- antenna tower -->
    <rect x="912" y="100" width="56" height="140"/>
    <rect x="936" y="56"  width="8"  height="46"/>
    <!-- 1801 California style slab -->
    <rect x="980"  y="60"  width="66" height="180"/>
    <rect x="1056" y="134" width="40" height="106"/>
    <!-- pointed crown tower -->
    <path d="M1106,240 L1106,92 L1134,60 L1162,92 L1162,240 Z"/>
    <rect x="1174" y="142" width="52" height="98"/>
    <rect x="1236" y="112" width="38" height="128"/>
    <!-- right low-rise -->
    <rect x="1284" y="168" width="58" height="72"/>
    <path d="M1352,240 L1352,138 L1376,120 L1400,138 L1400,240 Z"/>
    <rect x="1412" y="180" width="66" height="60"/>
    <rect x="1488" y="154" width="48" height="86"/>
    <rect x="1546" y="186" width="54" height="54"/>
  </g>
</svg>
